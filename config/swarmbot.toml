# SwarmBot Brain Configuration with Installed ACP Providers
data_dir = "data"
public_addr = "127.0.0.1:8787"

# Internal listener: the MCP gateway that exposes SwarmBot's team/task tools
# (`message_bot`, `post_to_group`, `handoff_task`, etc.) to ACP / CLI harnesses.
# Port 0 picks an ephemeral loopback port without conflicts; "" disables it.
internal_addr = "127.0.0.1:0"

default_backend = "opencode"

# ACP backends run their own sandboxed tools and answer ACP permission asks
# using `permission_mode`:
#   - "reject" (default): refuse every ACP permission ask so the agent reads,
#     answers, and uses SwarmBot's MCP team/task tools without mutating files.
#   - "allow": explicit opt-in that picks the agent's allow-once option per
#     action (never `*_always`, so no blanket grant outlives a turn).

# 1. OpenCode (Native ACP Agent installed on this machine)
[[backends]]
id = "opencode"
kind = "acp"
[backends.options]
command = "opencode"
args = ["acp"]
models_command = ["opencode", "models"]
permission_mode = "reject"
[backends.options.model_env]
OPENCODE_CONFIG_CONTENT = '{"model":"{model}"}'

# 2. Claude Code (via ACP adapter)
[[backends]]
id = "claude"
kind = "acp"
[backends.options]
command = "claude-code-acp"
permission_mode = "reject"

# 3. Codex (via ACP adapter)
[[backends]]
id = "codex"
kind = "acp"
[backends.options]
command = "codex-acp"
permission_mode = "reject"


[settings]
bot_messaging = true
max_hops = 8
max_tool_rounds = 32
max_running_tasks_per_bot = 3
max_task_restarts = 2
approval_expiry_secs = 600
auto_approve_read_only = true
transcript_mirror = true
compact_at_fraction = 0.6

[settings.safety]
default = "ask"
[settings.safety.surfaces]
read_file = "always"
write_file = "ask"
edit_file = "ask"
shell = "ask"
