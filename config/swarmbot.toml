# SwarmBot Brain Configuration with Pre-configured Providers
data_dir = "data"
public_addr = "127.0.0.1:8787"
default_backend = "fake"

# 1. Deterministic Fake Backend (for offline testing & development)
[[backends]]
id = "fake"
kind = "fake"
model = "fake"

# 2. Ollama (Local free inference, no API key needed)
[[backends]]
id = "ollama"
kind = "openai_compat"
base_url = "http://localhost:11434/v1"
model = "llama3"

# 3. OpenAI (GPT-4o, GPT-4o-mini)
[[backends]]
id = "openai"
kind = "openai_compat"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
model = "gpt-4o"

# 4. OpenRouter (Access to Claude 3.5, Gemini 1.5, DeepSeek, etc.)
[[backends]]
id = "openrouter"
kind = "openai_compat"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
model = "anthropic/claude-3.5-sonnet"

# 5. Groq (Fast Llama 3.3 inference)
[[backends]]
id = "groq"
kind = "openai_compat"
base_url = "https://api.groq.com/openai/v1"
api_key_env = "GROQ_API_KEY"
model = "llama-3.3-70b-versatile"

# 6. DeepSeek (DeepSeek Chat & DeepSeek Reasoner)
[[backends]]
id = "deepseek"
kind = "openai_compat"
base_url = "https://api.deepseek.com/v1"
api_key_env = "DEEPSEEK_API_KEY"
model = "deepseek-chat"

[settings]
bot_messaging = true
max_hops = 8
max_tool_rounds = 32
max_running_tasks_per_bot = 3
max_task_restarts = 2
approval_expiry_secs = 600
auto_approve_read_only = true
transcript_mirror = true
compact_at_fraction = 0.6

[settings.safety]
default = "ask"
[settings.safety.surfaces]
read_file = "always"
write_file = "ask"
edit_file = "ask"
shell = "ask"
