[package]
name = "swarmbot-ui"
description = "GPUI desktop app: sidebar, conversations, live streaming transcript, delegation graph, approval cards, nodes and settings."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "swarmbot_ui"
path = "src/lib.rs"

[[bin]]
name = "swarmbot-ui"
path = "src/main.rs"

[dependencies]
swarmbot-contracts = { workspace = true }
swarmbot-client = { workspace = true }
gpui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
pulldown-cmark = { workspace = true }
url = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
clap = { workspace = true }
chrono = { workspace = true }

[features]
default = []
# Compile shaders at runtime instead of build time (faster iteration, no
# build-time shader toolchain surprises).
runtime_shaders = ["gpui/runtime_shaders"]
