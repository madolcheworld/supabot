[package]
name = "swarmbot-cli"
description = "Terminal client: chat with bots, run one-shot tasks, watch delegation, answer approvals, pair nodes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "swarmbot"
path = "src/main.rs"

[dependencies]
swarmbot-contracts = { workspace = true }
swarmbot-client = { workspace = true }
swarmbot-core = { workspace = true }
swarmbot-llm = { workspace = true }
swarmbot-tools = { workspace = true }
swarmbot-store = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
crossterm = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
url = { workspace = true }
similar = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
# `test-support` compiles the client's `StubBrain` (a canned HTTP+WS brain on
# 127.0.0.1:0), which is how this crate tests `--brain` without a network and
# without a real daemon. It is a dev-dependency, so a shipped `swarmbot` never
# carries the stub.
swarmbot-client = { workspace = true, features = ["test-support"] }
