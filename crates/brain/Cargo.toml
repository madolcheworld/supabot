[package]
name = "swarmbot-brain"
description = "Composition root: the brain daemon with the public API, the live WebSocket, the node gateway and the in-process local node."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "swarmbot-brain"
path = "src/main.rs"

[lib]
name = "swarmbot_brain"
path = "src/lib.rs"

[dependencies]
swarmbot-contracts = { workspace = true }
swarmbot-core = { workspace = true }
swarmbot-llm = { workspace = true }
swarmbot-tools = { workspace = true }
swarmbot-mcp = { workspace = true }
swarmbot-store = { workspace = true }
# TLS termination for the public listener (D9.25). Both were already in the lock
# as transitive dependencies; naming them here adds no package to the graph.
tokio-rustls = { workspace = true }
rustls-pemfile = { workspace = true }
swarmbot-node-protocol = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
ed25519-dalek = { workspace = true }
dirs = { workspace = true }
url = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
swarmbot-client = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tempfile = "3"
# The API tests are integration tests on purpose: they speak to a real bound
# socket exactly the way a client does, so a route that only works through
# `oneshot` cannot pass.
reqwest = { workspace = true }
tokio-tungstenite = { workspace = true }
